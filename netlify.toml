[build]
  publish = "."
  command = "echo 'No build needed - static site'"

[[redirects]]
  from = "/Deepskilling/*"
  to = "/Deepskilling/:splat"
  status = 200

[[redirects]]
  from = "/Upskilling/*"
  to = "/Upskilling/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.headers]
  [context.production.headers.files]
    for = "/Deepskilling/*"
    Cache-Control = "public, max-age=31536000, immutable"

  [context.production.headers.upskilling]
    for = "/Upskilling/*"
    Cache-Control = "public, max-age=31536000, immutable"

  [context.production.headers.html]
    for = "/index.html"
    Cache-Control = "public, max-age=3600"
